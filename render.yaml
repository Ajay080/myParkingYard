services:
  - type: web
    name: car-parking-backend
    env: python
    region: oregon
    buildCommand: cd cps_backend && pip install poetry && poetry install --no-dev
    startCommand: cd cps_backend && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: car-parking-db
          property: connectionString
    healthCheckPath: /health
