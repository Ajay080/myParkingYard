<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#favicon-gradient)"/>
  
  <!-- Parking spaces -->
  <rect x="4" y="8" width="24" height="1" fill="white" opacity="0.8"/>
  <rect x="4" y="23" width="24" height="1" fill="white" opacity="0.8"/>
  
  <rect x="5" y="9" width="6" height="13" fill="none" stroke="white" stroke-width="0.8"/>
  <rect x="13" y="9" width="6" height="13" fill="none" stroke="white" stroke-width="0.8"/>
  <rect x="21" y="9" width="6" height="13" fill="none" stroke="white" stroke-width="0.8"/>
  
  <!-- Car -->
  <rect x="14" y="13" width="4" height="3" rx="0.5" fill="white"/>
  <circle cx="14.8" cy="15.5" r="0.4" fill="#2563eb"/>
  <circle cx="17.2" cy="15.5" r="0.4" fill="#2563eb"/>
  
  <!-- P letter -->
  <text x="16" y="29" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="white">P</text>
</svg>
