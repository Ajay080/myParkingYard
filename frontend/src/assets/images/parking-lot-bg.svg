<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="asphaltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="200" fill="url(#skyGradient)"/>
  
  <!-- Buildings silhouette -->
  <rect x="0" y="120" width="120" height="80" fill="#64748b"/>
  <rect x="120" y="100" width="100" height="100" fill="#475569"/>
  <rect x="220" y="110" width="80" height="90" fill="#64748b"/>
  <rect x="300" y="90" width="120" height="110" fill="#475569"/>
  <rect x="420" y="105" width="90" height="95" fill="#64748b"/>
  <rect x="510" y="85" width="110" height="115" fill="#475569"/>
  <rect x="620" y="95" width="100" height="105" fill="#64748b"/>
  <rect x="720" y="100" width="80" height="100" fill="#475569"/>
  
  <!-- Windows in buildings -->
  <rect x="10" y="130" width="8" height="10" fill="#fbbf24"/>
  <rect x="25" y="135" width="8" height="10" fill="#fbbf24"/>
  <rect x="40" y="140" width="8" height="8" fill="#fbbf24"/>
  <rect x="130" y="110" width="8" height="10" fill="#fbbf24"/>
  <rect x="145" y="120" width="8" height="10" fill="#fbbf24"/>
  <rect x="160" y="115" width="8" height="8" fill="#fbbf24"/>
  <rect x="320" y="100" width="8" height="10" fill="#fbbf24"/>
  <rect x="335" y="110" width="8" height="10" fill="#fbbf24"/>
  <rect x="350" y="105" width="8" height="8" fill="#fbbf24"/>
  
  <!-- Parking lot surface -->
  <rect x="0" y="200" width="800" height="400" fill="url(#asphaltGradient)"/>
  
  <!-- Parking lot lines (horizontal) -->
  <rect x="0" y="250" width="800" height="3" fill="white"/>
  <rect x="0" y="350" width="800" height="3" fill="white"/>
  <rect x="0" y="450" width="800" height="3" fill="white"/>
  <rect x="0" y="550" width="800" height="3" fill="white"/>
  
  <!-- Parking spaces (vertical lines) -->
  <rect x="100" y="200" width="2" height="400" fill="white"/>
  <rect x="200" y="200" width="2" height="400" fill="white"/>
  <rect x="300" y="200" width="2" height="400" fill="white"/>
  <rect x="400" y="200" width="2" height="400" fill="white"/>
  <rect x="500" y="200" width="2" height="400" fill="white"/>
  <rect x="600" y="200" width="2" height="400" fill="white"/>
  <rect x="700" y="200" width="2" height="400" fill="white"/>
  
  <!-- Cars in parking spaces -->
  <!-- Car 1 -->
  <rect x="110" y="260" width="80" height="35" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <rect x="115" y="265" width="70" height="25" rx="5" fill="#ef4444"/>
  <circle cx="125" cy="285" r="8" fill="#1f2937"/>
  <circle cx="175" cy="285" r="8" fill="#1f2937"/>
  <circle cx="125" cy="285" r="4" fill="#6b7280"/>
  <circle cx="175" cy="285" r="4" fill="#6b7280"/>
  
  <!-- Car 2 -->
  <rect x="310" y="260" width="80" height="35" rx="8" fill="#2563eb" filter="url(#shadow)"/>
  <rect x="315" y="265" width="70" height="25" rx="5" fill="#3b82f6"/>
  <circle cx="325" cy="285" r="8" fill="#1f2937"/>
  <circle cx="375" cy="285" r="8" fill="#1f2937"/>
  <circle cx="325" cy="285" r="4" fill="#6b7280"/>
  <circle cx="375" cy="285" r="4" fill="#6b7280"/>
  
  <!-- Car 3 -->
  <rect x="510" y="360" width="80" height="35" rx="8" fill="#059669" filter="url(#shadow)"/>
  <rect x="515" y="365" width="70" height="25" rx="5" fill="#10b981"/>
  <circle cx="525" cy="385" r="8" fill="#1f2937"/>
  <circle cx="575" cy="385" r="8" fill="#1f2937"/>
  <circle cx="525" cy="385" r="4" fill="#6b7280"/>
  <circle cx="575" cy="385" r="4" fill="#6b7280"/>
  
  <!-- Car 4 -->
  <rect x="210" y="460" width="80" height="35" rx="8" fill="#7c3aed" filter="url(#shadow)"/>
  <rect x="215" y="465" width="70" height="25" rx="5" fill="#8b5cf6"/>
  <circle cx="225" cy="485" r="8" fill="#1f2937"/>
  <circle cx="275" cy="485" r="8" fill="#1f2937"/>
  <circle cx="225" cy="485" r="4" fill="#6b7280"/>
  <circle cx="275" cy="485" r="4" fill="#6b7280"/>
  
  <!-- SUV -->
  <rect x="610" y="360" width="85" height="40" rx="10" fill="#1f2937" filter="url(#shadow)"/>
  <rect x="615" y="365" width="75" height="30" rx="8" fill="#374151"/>
  <circle cx="630" cy="390" r="10" fill="#000000"/>
  <circle cx="680" cy="390" r="10" fill="#000000"/>
  <circle cx="630" cy="390" r="5" fill="#6b7280"/>
  <circle cx="680" cy="390" r="5" fill="#6b7280"/>
  
  <!-- Parking lot entrance/exit signs -->
  <rect x="50" y="170" width="60" height="30" fill="#1f2937" filter="url(#shadow)"/>
  <rect x="55" y="175" width="50" height="20" fill="#374151"/>
  <text x="80" y="188" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">ENTRY</text>
  
  <rect x="690" y="170" width="60" height="30" fill="#1f2937" filter="url(#shadow)"/>
  <rect x="695" y="175" width="50" height="20" fill="#374151"/>
  <text x="720" y="188" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="white">EXIT</text>
  
  <!-- Trees for decoration -->
  <circle cx="50" cy="220" r="20" fill="#22c55e"/>
  <rect x="47" y="220" width="6" height="25" fill="#92400e"/>
  
  <circle cx="750" cy="230" r="18" fill="#22c55e"/>
  <rect x="747" y="230" width="6" height="20" fill="#92400e"/>
  
  <!-- Light poles -->
  <rect x="398" y="200" width="4" height="50" fill="#6b7280"/>
  <circle cx="400" cy="200" r="6" fill="#fbbf24"/>
  
  <rect x="148" y="480" width="4" height="50" fill="#6b7280"/>
  <circle cx="150" cy="480" r="6" fill="#fbbf24"/>
  
  <!-- Subtle texture overlay -->
  <rect width="800" height="400" y="200" fill="url(#asphaltGradient)" opacity="0.1"/>
</svg>
